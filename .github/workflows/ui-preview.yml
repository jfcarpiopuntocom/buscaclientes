name: Preview original BuscaClientes UI variants
on:
  push:
    branches: [ui-mcp-three-previews-20261010]
    paths:
      - 'ui-*.html'
      - '.github/workflows/ui-preview.yml'
      - 'preview-screenshots.cjs'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node preview-screenshots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: buscaclientes-real-ui-three-options
          path: screenshots/*.png
          if-no-files-found: error
