name: Compare 3 real Swiss-Army designs
on:
  push:
    branches: [design/three-distinct-options-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing regression suite and new JS syntax
        run: |
          node --check choice-layout.js
          node --check swiss-ux.js
          node --check intelligence.js
          node --test tests/*.test.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare A B C original features and mobile
        run: node choice-visual-qa.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: BuscaClientes-Three-REAL-Redesigns
          path: three-final/*.png
          if-no-files-found: error
