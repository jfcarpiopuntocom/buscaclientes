name: PayPal isolated guards
on:
  pull_request:
    paths:
      - 'paypal-worker.js'
      - 'paypal-schema.sql'
      - 'tests/paypal-webhook.test.mjs'
      - '.github/workflows/paypal-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/paypal-webhook.test.mjs
