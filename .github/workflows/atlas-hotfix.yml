name: ATLAS Terminator Zero-In Regression
on:
  push:
    branches: [hotfix/atlas-no-pink-terminator-zeroing-20261010]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and functional tests
        run: |
          node --check terminator-browser-qa.cjs
          node --check terminator-scan.js
          node --check atlas-layout.js
          node --check swiss-ux.js
          node --test tests/*.test.mjs
      - name: Browser engines
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check acquisition sequence in both browsers and mobile
        run: node terminator-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-terminator-sequence-evidence
          path: scan-screens/*.png
          if-no-files-found: error
